<title>Bonus Ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#f4f6f8; --card:#ffffff; --sunk:#eef1f5;
  --ink:#131820; --ink-2:#4a5566; --ink-3:#7b8798;
  --rule:#dde3ea; --rule-2:#c9d2dc;
  --accent:#2c4a7c; --accent-ink:#ffffff; --accent-wash:#e6ecf5;
  --banked:#1f6b4a; --banked-wash:#e2efe8;
  --caution:#8a6412; --caution-wash:#f5eddb;
  --blocked:#96332b; --blocked-wash:#f6e6e3;
  --shadow:0 1px 2px rgba(19,24,32,.05), 0 1px 1px rgba(19,24,32,.04);
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:9px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11141a; --card:#191d25; --sunk:#141821;
    --ink:#e9edf3; --ink-2:#a6b1c0; --ink-3:#78838f;
    --rule:#2a303b; --rule-2:#39414f;
    --accent:#7ea3d8; --accent-ink:#0e1218; --accent-wash:#1c2634;
    --banked:#63b691; --banked-wash:#16261f;
    --caution:#d4a44a; --caution-wash:#2a2216;
    --blocked:#e08a80; --blocked-wash:#2b1a18;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 1px 1px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#11141a; --card:#191d25; --sunk:#141821;
  --ink:#e9edf3; --ink-2:#a6b1c0; --ink-3:#78838f;
  --rule:#2a303b; --rule-2:#39414f;
  --accent:#7ea3d8; --accent-ink:#0e1218; --accent-wash:#1c2634;
  --banked:#63b691; --banked-wash:#16261f;
  --caution:#d4a44a; --caution-wash:#2a2216;
  --blocked:#e08a80; --blocked-wash:#2b1a18;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 1px 1px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}
.shell{max-width:1240px;margin:0 auto;padding:30px 22px 72px}

/* ---------- masthead ---------- */
.masthead{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between;
  border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:6px}
.masthead h1{font-family:var(--serif);font-weight:600;font-size:2.1rem;letter-spacing:-.015em;
  margin:0;text-wrap:balance}
.masthead p{margin:5px 0 0;color:var(--ink-2);font-size:.92rem;max-width:56ch}
.stamp{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);text-align:right;line-height:1.7}
.stamp b{display:block;color:var(--ink-2);font-weight:500}
.privacy{font-size:.8rem;color:var(--ink-2);margin:10px 0 26px;
  border-left:2px solid var(--rule-2);padding-left:10px}

/* ---------- layout ---------- */
.grid{display:grid;grid-template-columns:272px minmax(0,1fr);gap:26px;align-items:start}
main{min-width:0}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}

/* ---------- control rail ---------- */
.rail{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  padding:16px 16px 18px;box-shadow:var(--shadow);position:sticky;top:18px}
@media(max-width:900px){.rail{position:static}}
.rail h2,.legend h3{font-family:var(--mono);font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 12px;font-weight:500}
.rail h2+.field{margin-top:0}
.rail h2.later{margin-top:22px;padding-top:16px;border-top:1px solid var(--rule)}
.field{margin-top:12px}
.field label{display:block;font-size:.76rem;color:var(--ink-2);margin-bottom:4px}
.field input,.field select{width:100%;padding:7px 9px;border:1px solid var(--rule-2);border-radius:6px;
  background:var(--paper);color:var(--ink);font:inherit;font-size:.86rem}
.field input[type=number],.field input[inputmode=numeric]{font-family:var(--mono);font-variant-numeric:tabular-nums}
.field input:focus-visible,.field select:focus-visible,button:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
.hint{display:block;font-size:.72rem;color:var(--ink-3);margin-top:5px;line-height:1.4}
.pair{display:flex;gap:8px}.pair>*{flex:1;min-width:0}
.switch{display:flex;gap:9px;align-items:flex-start;margin-top:11px;font-size:.82rem;color:var(--ink)}
.switch input{margin:3px 0 0;accent-color:var(--accent)}
.reset{margin-top:16px;width:100%;padding:7px;border:1px solid var(--rule-2);background:none;
  color:var(--ink-2);font:inherit;font-size:.78rem;border-radius:6px;cursor:pointer}
.reset:hover{border-color:var(--ink-3);color:var(--ink)}

/* ---------- figures ---------- */
.figures{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-bottom:22px}
.fig{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow)}
.fig .v{font-family:var(--mono);font-size:1.5rem;font-weight:500;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;display:block;line-height:1.15}
.fig .k{font-size:.71rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  font-family:var(--mono);margin-top:3px;display:block}
.fig .n{font-size:.78rem;color:var(--ink-2);margin-top:5px;display:block}
.fig.lead .v{color:var(--banked)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:18px;flex-wrap:wrap}
.tab{padding:9px 15px;border:0;background:none;color:var(--ink-3);font:inherit;font-size:.88rem;
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .c{font-family:var(--mono);font-size:.74rem;color:var(--ink-3);margin-left:5px}

/* ---------- schedule ---------- */
.schedule{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  padding:16px 18px 10px;box-shadow:var(--shadow);margin-bottom:18px}
.sched-scroll{overflow-x:auto}
.sched-inner{min-width:660px}
.axis{position:relative;height:20px;border-bottom:1px solid var(--rule);margin-left:var(--lane);
  margin-bottom:8px}
.axis span{position:absolute;top:0;font-family:var(--mono);font-size:.66rem;color:var(--ink-3);
  letter-spacing:.04em;transform:translateX(-1px);padding-left:5px;border-left:1px solid var(--rule)}
.lane{display:grid;grid-template-columns:var(--lane) minmax(0,1fr);align-items:center;
  gap:0;padding:5px 0}
.lane .who{font-size:.775rem;color:var(--ink-2);padding-right:12px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.lane .who b{color:var(--ink);font-weight:600}
.track{position:relative;height:22px;background:var(--sunk);border-radius:4px}
.seg{position:absolute;top:0;height:22px;border-radius:4px}
.seg.win{background:var(--accent)}
.seg.wait{background:var(--accent-wash);border:1px solid var(--accent);border-left:0}
.seg.hold{background:repeating-linear-gradient(135deg,var(--sunk),var(--sunk) 4px,var(--rule) 4px,var(--rule) 5px);
  border:1px solid var(--rule)}
.tick{position:absolute;top:4px;width:2px;height:14px;background:var(--accent-ink);opacity:.85;border-radius:1px}
.pin{position:absolute;top:2px;height:18px;display:flex;align-items:center;gap:4px;
  transform:translateX(4px);font-family:var(--mono);font-size:.68rem;color:var(--banked);white-space:nowrap}
.pin::before{content:"";width:7px;height:7px;border-radius:99px;background:var(--banked);
  transform:translateX(-4px)}
.legend{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:12px;padding-top:11px;
  border-top:1px solid var(--rule)}
.legend span{display:flex;align-items:center;gap:6px;font-size:.74rem;color:var(--ink-2)}
.chip{width:16px;height:10px;border-radius:3px;display:inline-block}
.chip.win{background:var(--accent)}
.chip.wait{background:var(--accent-wash);border:1px solid var(--accent)}
.chip.hold{background:repeating-linear-gradient(135deg,var(--sunk),var(--sunk) 4px,var(--rule) 4px,var(--rule) 5px);border:1px solid var(--rule)}

/* ---------- action strip ---------- */
.next{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--caution);
  border-radius:var(--r);padding:14px 17px;margin-bottom:18px;box-shadow:var(--shadow)}
.next h3{font-family:var(--mono);font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 9px;font-weight:500}
.next ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.next li{display:flex;gap:11px;font-size:.87rem;align-items:baseline}
.next time{font-family:var(--mono);font-size:.78rem;color:var(--ink-2);flex:0 0 auto;min-width:5.6em}
.next .in{font-family:var(--mono);font-size:.72rem;color:var(--ink-3);flex:0 0 auto}

/* ---------- offer cards ---------- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.card-top{display:flex;gap:14px;align-items:flex-start;padding:14px 17px 12px}
.rung{font-family:var(--mono);font-size:.78rem;color:var(--ink-3);padding-top:3px;flex:0 0 auto}
.card-top h3{margin:0;font-family:var(--serif);font-size:1.12rem;font-weight:600;letter-spacing:-.01em}
.card-top .sub{color:var(--ink-2);font-size:.8rem;margin-top:2px}
.card-top .amt{margin-left:auto;text-align:right;flex:0 0 auto}
.card-top .amt b{font-family:var(--mono);font-size:1.24rem;font-weight:500;color:var(--banked);
  font-variant-numeric:tabular-nums;display:block}
.card-top .amt s{display:block;font-family:var(--mono);font-size:.68rem;color:var(--ink-3);
  text-decoration:none;margin-top:1px}
.tag{display:inline-block;font-family:var(--mono);font-size:.63rem;letter-spacing:.08em;
  text-transform:uppercase;padding:2px 6px;border-radius:3px;margin-right:5px;
  background:var(--sunk);color:var(--ink-2);border:1px solid var(--rule)}
.tag.high{background:var(--banked-wash);color:var(--banked);border-color:currentColor}
.tag.medium{background:var(--caution-wash);color:var(--caution);border-color:currentColor}
.tag.low{background:var(--blocked-wash);color:var(--blocked);border-color:currentColor}
.tag.code{background:var(--accent-wash);color:var(--accent);border-color:currentColor;text-transform:none;letter-spacing:.02em}
.steps{list-style:none;margin:0;padding:0 17px 4px;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:6.4em minmax(0,1fr);gap:12px;padding:5px 0;
  border-top:1px dotted var(--rule);font-size:.87rem;align-items:baseline}
.steps li:first-child{border-top:0}
.steps time{font-family:var(--mono);font-size:.78rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.steps .fine{color:var(--ink-3);font-size:.8rem}
.notes{padding:9px 17px 13px;background:var(--sunk);border-top:1px solid var(--rule);
  display:flex;flex-direction:column;gap:5px}
.notes p{margin:0;font-size:.79rem;color:var(--ink-2);display:flex;gap:7px}
.notes p::before{content:"—";color:var(--caution);flex:0 0 auto}
.notes .src{margin-top:3px;font-size:.76rem}
.notes .src::before{content:none}

/* ---------- tables ---------- */
.sheet{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.sheet h3{font-family:var(--mono);font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);margin:0;padding:13px 17px 11px;font-weight:500;border-bottom:1px solid var(--rule)}
.sheet h3 em{font-style:normal;color:var(--ink-2)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{text-align:left;font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;padding:9px 14px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:9px 14px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--sunk)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td .sub{color:var(--ink-3);font-size:.78rem;display:block}
td.reason{color:var(--ink-2);min-width:22em}
.empty{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:.9rem}
.empty b{color:var(--ink-2);display:block;font-size:1rem;margin-bottom:5px;font-family:var(--serif)}

/* ---------- footer ---------- */
footer{margin-top:38px;padding-top:18px;border-top:1px solid var(--rule);
  color:var(--ink-3);font-size:.79rem;display:flex;flex-direction:column;gap:9px}
footer b{color:var(--ink-2)}
footer code{font-family:var(--mono);font-size:.92em;background:var(--sunk);padding:1px 5px;border-radius:3px}
.copy{align-self:flex-start;padding:7px 13px;border:1px solid var(--rule-2);background:var(--card);
  color:var(--ink);font:inherit;font-size:.8rem;border-radius:6px;cursor:pointer}
.copy:hover{border-color:var(--accent);color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
