<title>Bonus Ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Dark-first. :root is the dark palette; light is the override. */
:root{
  --bg:#0e0d0b; --bg-2:#131210; --panel:#171613; --raised:#1d1b17; --sunk:#111110;
  --ink:#f3f0e9; --ink-2:#a29d93; --ink-3:#6f6b64;
  --rule:#262420; --rule-2:#332f29;
  --accent:#f3f0e9; --accent-on:#0e0d0b; --accent-dim:#38342c;
  --gold:#e3b341; --good:#7cc79b; --warn:#d99a4e; --bad:#e0806f;
  --good-dim:#16241d; --warn-dim:#241b11; --bad-dim:#251715;
  --glow:radial-gradient(120% 90% at 50% -10%, rgba(227,179,65,.10), transparent 62%);
  --shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 8px 24px -12px rgba(0,0,0,.7);
  --sans:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#faf9f6; --bg-2:#f4f2ed; --panel:#ffffff; --raised:#ffffff; --sunk:#f0eee9;
    --ink:#16150f; --ink-2:#5f5b53; --ink-3:#8b867e;
    --rule:#e5e1d8; --rule-2:#d4cfc4;
    --accent:#16150f; --accent-on:#faf9f6; --accent-dim:#dcd6c9;
    --gold:#9a7215; --good:#2f7a54; --warn:#8f5c15; --bad:#a34032;
    --good-dim:#e7f1ea; --warn-dim:#f5ecdc; --bad-dim:#f7e8e4;
    --glow:radial-gradient(120% 90% at 50% -10%, rgba(154,114,21,.07), transparent 62%);
    --shadow:0 1px 2px rgba(22,21,15,.05), 0 8px 24px -16px rgba(22,21,15,.25);
  }
}
:root[data-theme="light"]{
  --bg:#faf9f6; --bg-2:#f4f2ed; --panel:#ffffff; --raised:#ffffff; --sunk:#f0eee9;
  --ink:#16150f; --ink-2:#5f5b53; --ink-3:#8b867e;
  --rule:#e5e1d8; --rule-2:#d4cfc4;
  --accent:#16150f; --accent-on:#faf9f6; --accent-dim:#dcd6c9;
  --gold:#9a7215; --good:#2f7a54; --warn:#8f5c15; --bad:#a34032;
  --good-dim:#e7f1ea; --warn-dim:#f5ecdc; --bad-dim:#f7e8e4;
  --glow:radial-gradient(120% 90% at 50% -10%, rgba(154,114,21,.07), transparent 62%);
  --shadow:0 1px 2px rgba(22,21,15,.05), 0 8px 24px -16px rgba(22,21,15,.25);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);background-image:var(--glow);background-repeat:no-repeat;
  color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule-2)}
a:hover{border-bottom-color:var(--ink-2)}
.shell{max-width:1180px;margin:0 auto;padding:0 24px 96px}

/* ---------- hero ---------- */
.masthead{padding:76px 0 40px;display:flex;flex-direction:column;gap:20px}
.masthead h1{
  font-size:clamp(2.9rem,7.4vw,5.1rem);font-weight:700;letter-spacing:-.045em;line-height:.94;
  margin:0;max-width:15ch;text-wrap:balance;
}
.masthead p{margin:0;color:var(--ink-2);font-size:clamp(1rem,1.6vw,1.2rem);max-width:46ch;line-height:1.45}
.stamp{display:flex;flex-wrap:wrap;gap:8px;font-family:var(--mono);font-size:.72rem;
  letter-spacing:.02em;color:var(--ink-2)}
.stamp b,.stamp span{display:inline-flex;align-items:center;gap:7px;font-weight:400;
  border:1px solid var(--rule);border-radius:99px;padding:5px 12px;background:var(--panel)}
.stamp b::before{content:"";width:6px;height:6px;border-radius:99px;background:var(--good)}
.privacy{margin:0;color:var(--ink-3);font-size:.82rem;max-width:60ch}

/* ---------- layout ---------- */
.grid{display:grid;grid-template-columns:288px minmax(0,1fr);gap:28px;align-items:start}
main{min-width:0}
@media(max-width:940px){.grid{grid-template-columns:minmax(0,1fr)}}

/* ---------- control rail ---------- */
.rail{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);
  padding:20px;box-shadow:var(--shadow);position:sticky;top:20px}
@media(max-width:940px){.rail{position:static}}
.rail h2{font-family:var(--mono);font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 14px;font-weight:400}
.rail h2.later{margin-top:26px;padding-top:20px;border-top:1px solid var(--rule)}
.field{margin-top:14px}
.field label{display:block;font-size:.78rem;color:var(--ink-2);margin-bottom:6px}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--rule-2);
  border-radius:var(--r-sm);background:var(--sunk);color:var(--ink);font:inherit;font-size:.87rem;
  transition:border-color .12s ease}
.field input:hover,.field select:hover{border-color:var(--ink-3)}
.field input[type=number],.field input[type=date]{font-family:var(--mono);font-variant-numeric:tabular-nums}
.field input[type=date]{font-size:.8rem;letter-spacing:-.02em;padding-left:9px;padding-right:6px}
.field input:focus-visible,.field select:focus-visible,button:focus-visible,a:focus-visible{
  outline:2px solid var(--gold);outline-offset:2px}
.hint{display:block;font-size:.72rem;color:var(--ink-3);margin-top:6px;line-height:1.45}
.pair{display:flex;gap:10px}.pair>*{flex:1;min-width:0}
.switch{display:flex;gap:10px;align-items:flex-start;margin-top:13px;font-size:.83rem;
  color:var(--ink-2);cursor:pointer}
.switch:hover{color:var(--ink)}
.switch input{margin:3px 0 0;accent-color:var(--gold);cursor:pointer}
.reset{margin-top:20px;width:100%;padding:9px;border:1px solid var(--rule-2);background:transparent;
  color:var(--ink-2);font:inherit;font-size:.79rem;border-radius:var(--r-sm);cursor:pointer;
  transition:border-color .12s ease,color .12s ease}
.reset:hover{border-color:var(--ink-3);color:var(--ink)}

/* ---------- figures ---------- */
.figures{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:30px}
.fig{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);
  padding:18px 20px 16px;box-shadow:var(--shadow)}
.fig .v{font-size:2rem;font-weight:600;letter-spacing:-.04em;line-height:1.05;display:block;
  font-variant-numeric:tabular-nums}
.fig.lead .v{color:var(--gold)}
.fig .k{font-family:var(--mono);font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin-top:9px;display:block}
.fig .n{font-size:.81rem;color:var(--ink-2);margin-top:6px;display:block}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
.tab{padding:8px 15px;border:1px solid transparent;background:transparent;color:var(--ink-3);
  font:inherit;font-size:.87rem;cursor:pointer;border-radius:99px;display:inline-flex;
  align-items:center;gap:8px;transition:color .12s ease,background .12s ease,border-color .12s ease}
.tab:hover{color:var(--ink-2);border-color:var(--rule)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-on);border-color:var(--accent);font-weight:500}
.tab .c{font-family:var(--mono);font-size:.72rem;opacity:.6}

/* ---------- schedule ---------- */
.schedule{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);
  padding:22px 24px 16px;box-shadow:var(--shadow);margin-bottom:16px}
.sched-scroll{overflow-x:auto}
.sched-inner{min-width:680px}
.axis{position:relative;height:22px;margin-left:var(--lane);margin-bottom:10px}
.axis span{position:absolute;top:0;font-family:var(--mono);font-size:.66rem;color:var(--ink-3);
  padding-left:7px;border-left:1px solid var(--rule);height:100%;display:flex;align-items:flex-start}
.lane{display:grid;grid-template-columns:var(--lane) minmax(0,1fr);align-items:center;padding:5px 0}
.lane .who{font-size:.8rem;color:var(--ink-3);padding-right:16px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.lane .who b{color:var(--ink);font-weight:500}
.track{position:relative;height:26px;background:var(--sunk);border-radius:6px;
  border:1px solid var(--rule)}
.seg{position:absolute;top:-1px;height:26px;border-radius:6px}
.seg.win{background:var(--accent)}
.seg.wait{background:var(--accent-dim)}
.seg.hold{background:repeating-linear-gradient(115deg,transparent,transparent 5px,var(--rule) 5px,var(--rule) 6px)}
.tick{position:absolute;top:6px;width:2px;height:14px;background:var(--accent-on);
  opacity:.75;border-radius:1px}
.pin{position:absolute;top:4px;height:18px;display:flex;align-items:center;
  transform:translateX(9px);font-family:var(--mono);font-size:.7rem;color:var(--gold);white-space:nowrap}
.pin::before{content:"";width:6px;height:6px;border-radius:99px;background:var(--gold);
  transform:translateX(-9px)}
.legend{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-top:16px;padding-top:14px;
  border-top:1px solid var(--rule)}
.legend span{display:flex;align-items:center;gap:8px;font-size:.76rem;color:var(--ink-3)}
.chip{width:18px;height:11px;border-radius:3px;display:inline-block}
.chip.win{background:var(--accent)}
.chip.wait{background:var(--accent-dim)}
.chip.hold{background:repeating-linear-gradient(115deg,transparent,transparent 5px,var(--rule) 5px,var(--rule) 6px);border:1px solid var(--rule)}

/* ---------- next up ---------- */
.next{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);
  padding:20px 24px;margin-bottom:16px;box-shadow:var(--shadow)}
.next h3{font-family:var(--mono);font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 14px;font-weight:400}
.next ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.next li{display:flex;gap:14px;font-size:.88rem;align-items:baseline;padding:8px 0;
  border-top:1px solid var(--rule)}
.next li:first-child{border-top:0;padding-top:0}
.next time{font-family:var(--mono);font-size:.78rem;color:var(--ink-3);flex:0 0 auto;min-width:5.4em}
.next .in{font-family:var(--mono);font-size:.72rem;color:var(--ink-3);flex:0 0 auto;margin-left:auto}
.next b{font-weight:500}

/* ---------- offer cards ---------- */
.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);
  box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;
  transition:border-color .14s ease}
.card:hover{border-color:var(--rule-2)}
.card-top{display:flex;gap:16px;align-items:flex-start;padding:20px 24px 16px}
.rung{font-family:var(--mono);font-size:.74rem;color:var(--ink-3);padding-top:6px;flex:0 0 auto}
.card-top h3{margin:0;font-size:1.24rem;font-weight:600;letter-spacing:-.022em;line-height:1.2}
.card-top .sub{color:var(--ink-3);font-size:.8rem;margin-top:7px;display:flex;
  flex-wrap:wrap;gap:8px;align-items:center}
.card-top .amt{margin-left:auto;text-align:right;flex:0 0 auto}
.card-top .amt b{font-size:1.6rem;font-weight:600;color:var(--gold);letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;display:block;line-height:1}
.card-top .amt s{display:block;font-family:var(--mono);font-size:.68rem;color:var(--ink-3);
  text-decoration:none;margin-top:6px}
.tag{display:inline-flex;font-family:var(--mono);font-size:.63rem;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 8px;border-radius:99px;
  background:var(--sunk);color:var(--ink-3);border:1px solid var(--rule)}
.tag.high{background:var(--good-dim);color:var(--good);border-color:transparent}
.tag.medium{background:var(--warn-dim);color:var(--warn);border-color:transparent}
.tag.low{background:var(--bad-dim);color:var(--bad);border-color:transparent}
.tag.code{background:var(--accent-dim);color:var(--ink);border-color:var(--rule-2);
  text-transform:none;letter-spacing:.02em}
.steps{list-style:none;margin:0;padding:0 24px 6px;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:6.2em minmax(0,1fr);gap:14px;padding:9px 0;
  border-top:1px solid var(--rule);font-size:.88rem;align-items:baseline}
.steps li:first-child{border-top:0}
.steps time{font-family:var(--mono);font-size:.78rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.steps b{font-weight:500}
.steps .fine{color:var(--ink-3);font-size:.8rem}
.notes{padding:16px 24px 20px;background:var(--sunk);border-top:1px solid var(--rule);
  display:flex;flex-direction:column;gap:8px}
.notes p{margin:0;font-size:.81rem;color:var(--ink-2);display:flex;gap:10px;line-height:1.5}
.notes p::before{content:"";flex:0 0 auto;width:3px;height:3px;border-radius:99px;
  background:var(--warn);margin-top:.6em}
.notes .src{margin-top:6px;font-size:.78rem;color:var(--ink-3)}
.notes .src::before{content:none}

/* ---------- tables ---------- */
.sheet{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);
  box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.sheet h3{font-size:.95rem;font-weight:600;letter-spacing:-.01em;margin:0;
  padding:18px 24px 16px;border-bottom:1px solid var(--rule)}
.sheet h3 em{font-style:normal;color:var(--ink-3);font-weight:400;font-size:.86rem}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);font-weight:400;padding:12px 20px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:12px 20px;border-bottom:1px solid var(--rule);vertical-align:top;color:var(--ink-2)}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--sunk)}
td b{color:var(--ink);font-weight:500}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td .sub{color:var(--ink-3);font-size:.78rem;display:block;margin-top:2px}
td.reason{min-width:22em}
.empty{padding:64px 24px;text-align:center;color:var(--ink-3);font-size:.9rem}
.empty b{color:var(--ink);display:block;font-size:1.15rem;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}

/* ---------- footer ---------- */
footer{margin-top:56px;padding-top:26px;border-top:1px solid var(--rule);
  color:var(--ink-3);font-size:.81rem;display:flex;flex-direction:column;gap:12px;max-width:78ch}
footer b{color:var(--ink-2);font-weight:500}
footer code{font-family:var(--mono);font-size:.92em;background:var(--sunk);padding:2px 7px;
  border-radius:5px;border:1px solid var(--rule);color:var(--ink-2)}
.footerActions{display:flex;gap:10px;flex-wrap:wrap;align-self:flex-start}
.copy{padding:10px 18px;border:1px solid transparent;background:var(--accent);
  color:var(--accent-on);font:inherit;font-size:.84rem;font-weight:500;border-radius:99px;cursor:pointer;
  transition:opacity .12s ease}
.copy:hover{opacity:.85}
.copy.ghost{background:transparent;border-color:var(--rule);color:var(--ink-2)}
.copy.ghost:hover{background:var(--sunk);opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
