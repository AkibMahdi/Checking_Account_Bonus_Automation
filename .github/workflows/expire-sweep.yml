name: expire-sweep

on:
  schedule:
    - cron: "0 7 * * *"       # daily 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Archive past-deadline offers
        id: sweep
        run: python -m scripts.expire_sweep
      - name: Commit
        run: |
          if ! git diff --quiet -- offers; then
            git config user.name "offer-bot"
            git config user.email "offer-bot@users.noreply.github.com"
            git add -A offers
            git commit -m "chore: archive ${{ steps.sweep.outputs.archived }} expired offer(s)"
            git push
          fi
      - name: Summary
        run: |
          {
            echo "### Expire sweep"
            echo "- archived: ${{ steps.sweep.outputs.archived }}"
            echo "- expiring within 14 days: ${{ steps.sweep.outputs.expiring }}"
            echo "- stale (>45 days unverified): ${{ steps.sweep.outputs.stale }}"
          } >> "$GITHUB_STEP_SUMMARY"
