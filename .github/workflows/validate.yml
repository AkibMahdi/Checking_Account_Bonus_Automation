name: validate

on:
  pull_request:
    paths:
      - "offers/**"
      - "schema/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Schema + sanity checks
        run: python -m scripts.validate
      - name: Dead-link check (warnings only)
        if: github.event_name == 'pull_request'
        run: python -m scripts.validate --check-links
        continue-on-error: true
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Build dist (must not error)
        run: python -m scripts.build_dist
