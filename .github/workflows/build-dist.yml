name: build-dist

on:
  push:
    branches: [main]
    paths:
      - "offers/**"
      - "web/**"
      - "scripts/build_dist.py"
      - "scripts/build_ui.py"
      - ".github/workflows/build-dist.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build bundle
        run: python -m scripts.build_dist
      - name: Build the Bonus Ladder page
        run: python -m scripts.build_ui
      - name: Commit dist and page
        run: |
          if ! git diff --quiet -- dist web/bonus-ladder.html; then
            git config user.name "offer-bot"
            git config user.email "offer-bot@users.noreply.github.com"
            git add dist web/bonus-ladder.html
            git commit -m "chore: rebuild dist bundle and Bonus Ladder page"
            git push
          fi
      - name: Assemble the Pages site
        run: |
          mkdir -p _site
          cp -r web/* _site/
          cp -r dist _site/dist
          # web/index.html is the older, lighter page (fetches dist/offers.json at
          # runtime instead of inlining it). Keep it reachable at /lite.html, but the
          # pretty root URL — what a person actually gets sent — should be the current,
          # full-featured, installable-as-an-app page.
          cp web/index.html _site/lite.html
          cp web/bonus-ladder.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
